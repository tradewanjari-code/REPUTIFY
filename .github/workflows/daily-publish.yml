name: Daily AI Website Publisher

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 AM IST)
    - cron: "0 3 * * *"
  workflow_dispatch: # Allows manual testing from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai

      - name: Generate new AI post and rebuild site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_TITLE: "AutoPulse AI"
          SITE_TAGLINE: "Daily automated insights on AI, tech, and digital workflows."
          SITE_NICHE: "AI tools, automation workflows, and practical tech guides"
          # Optional: uncomment to use a custom model or OpenAI-compatible endpoint
          # OPENAI_MODEL: "gpt-4o-mini"
          # OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
        run: python REPUTIFY_site.py

      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json dist/
          git diff --staged --quiet || git commit -m "chore: publish daily AI article"
          git push
